[package]
name = "radb"
version = "0.2.0"
edition = "2024"

# Module 1's standalone storage tool.
[[bin]]
name = "radb-storage"
path = "src/bin/radb_storage.rs"

# Module 2's standalone execution-engine tool.
[[bin]]
name = "radb-exec"
path = "src/bin/radb_exec.rs"

# Module 3's standalone SQL front-end tool.
[[bin]]
name = "radb-sql"
path = "src/bin/radb_sql.rs"

# Module 4's standalone optimizer tool.
[[bin]]
name = "radb-opt"
path = "src/bin/radb_opt.rs"

# Module integration binary
[[bin]]
name = "radb"
path = "src/bin/radb/main.rs"

[profile.release]
opt-level = 3

[dependencies]
bincode = "1.3"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
